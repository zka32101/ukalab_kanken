plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin は Android/Kotlin プラグインの後に適用する
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

// Signing configuration
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.yourwish.ukarulab.kanji"
    // Google Play の要件: targetSdk 36 以上（2026年〜）
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        // flutter_local_notifications が Java 8 の日時 API を使うため
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.yourwish.ukarulab.kanji"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('debug.keystore')
            storePassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // key.properties（本番keystore情報）が無い環境ではdebug署名にフォールバックし、
            // ビルドが通るかどうかの検証のみ行う（CI向け）。実際のPlay Store提出用AABは
            // key.propertiesを用意したローカル環境でビルドすること。
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug

            // ネイティブコードのデバッグシンボルをAABに含める（Play Consoleの警告対応）
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // Firebase: 各firebase_*パッケージ（firebase_core, firebase_auth等）が
    // それぞれ自身のFlutterFire Gradleプラグイン経由でBOMとネイティブ依存
    // (正しいartifact名)を自動追加するため、ここでの手動指定は不要かつ
    // バージョン/artifact名の不整合(firebase-remote-configは誤りで
    // 正しくはfirebase-config)を招くため削除。

    // Google Play Services
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // AndroidX
    implementation 'androidx.multidex:multidex:2.0.1'
}
