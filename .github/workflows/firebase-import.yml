name: Firebase Data Import

on:
  # 手動トリガー
  workflow_dispatch:

  # 注意: export_data/ は旧データ(取り込み禁止。docs/data_verification/README.md 参照)。
  # 誤投入防止のため、push/release での自動実行は行わず手動実行のみとする。
  # 正本は scripts/seed-kanji-questions.js と scripts/seed-exam-questions*.js。

jobs:
  import-firestore-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install seed script dependencies
        working-directory: scripts
        run: npm ci || npm install

      - name: Setup Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      - name: Import kanji questions (canonical seed scripts)
        working-directory: scripts
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
          node seed-kanji-questions.js
          node seed-exam-questions.js
          node seed-exam-questions-l9-l5.js
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Verify import
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
          echo "Import completed successfully ✅"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/firebase-key.json
