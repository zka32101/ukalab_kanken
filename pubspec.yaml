name: kanken
description: "うかラボ漢字検定 - 漢字検定学習アプリ"
publish_to: 'none'

version: 1.0.2+4
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.1.6
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3

  # 端末内の学習記録（推しの成長）。app_common_kit も使う
  shared_preferences: ^2.3.0

  # Animation & Lottie
  lottie: ^2.4.0
  path_drawing: ^1.0.1

  # Fonts
  google_fonts: ^6.1.0

  # Audio & Haptics
  audioplayers: ^5.0.0

  # Charts
  fl_chart: ^1.0.0

  # Ads
  google_mobile_ads: ^5.0.0

  # Subscription / IAP (RevenueCat)
  purchases_flutter: ^10.13.2

  # Utils
  intl: ^0.19.0
  logger: ^2.0.0
  go_router: ^12.0.0
  uuid: ^4.0.0
  url_launcher: ^6.2.0

  # Common kits (全アプリ共通基盤)
  # app_common_kit は ukalab_core v0.71.2 が v3.11.0 を指定している。pub は kit のタグが食い違うと
  # 解決できないため、core に合わせて v3.11.0 に固定する。
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v3.11.0
  # うかラボ専用のUI（推し・コイン・着せ替え・テーマ）。app_common_kit v1.0.0 から移った
  ukalab_core:
    git:
      url: https://github.com/zka32101/ukalab_core.git
      ref: v0.75.0
  share_plus: ^13.3.1

  # 学習リマインダーの端末通知（Android・iOS のみ。Web は何もしない）
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  custom_lint: ^0.5.0
  riverpod_lint: ^2.0.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter
  firebase_core_platform_interface: ^6.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/sounds/
    - assets/branding/
    - assets/icons_common/
    - assets/readings/
    - assets/features/
